name: Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Stage 1: Build & Publish Container Image
  # ==========================================
  publish:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # Stage 2: Deploy to Production Simulation
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Simulated Deployment Step
        run: |
          echo "============================================="
          echo "🚀 Deploying to Production..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Container Image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          echo "Target Environment: Production"
          echo "Health check verification passed!"
          echo "============================================="

      - name: Post Deployment Summary
        run: |
          echo "### Deployment Report 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`production\`" >> $GITHUB_STEP_SUMMARY
