name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Stage 1: Linting & Code Quality
  # ==========================================
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Security Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high

  # ==========================================
  # Stage 2: Automated Testing (Matrix Build)
  # ==========================================
  test:
    name: Test on Node ${{ matrix.node-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage

      - name: Upload Test Coverage Artifact (Node 22 only)
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================
  # Stage 3: Docker Build Verification
  # ==========================================
  docker-check:
    name: Docker Build Validation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cicd-starter-practice:latest
